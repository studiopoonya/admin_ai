name: Deploy to VPS

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Test Network Connectivity
      run: |
        echo "Testing DNS resolution..."
        nslookup ${{ secrets.VPS_HOST }}

        echo "Testing TCP connection to port 22..."
        timeout 10 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.VPS_HOST }}/22" && echo "Port 22 is open" || echo "Port 22 is closed or unreachable"

    - name: Test SSH Connection
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        timeout: 30s
        command_timeout: 30s
        script: |
          echo "=========================================="
          echo "SSH Connection Test"
          echo "=========================================="
          echo "User: $(whoami)"
          echo "Working Directory: $(pwd)"
          echo "Checking app directory..."
          ls -la /www/wwwroot/dashboard.waktunyaphotobooth.com
          echo "SSH Test PASSED ✓"

    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        timeout: 60s
        command_timeout: 60s
        script: |
          set -e  # Exit on any error

          APP_PATH="/www/wwwroot/dashboard.waktunyaphotobooth.com/admin_ai"

          echo "=========================================="
          echo "DEPLOYMENT START"
          echo "=========================================="
          echo "Time: $(date)"
          echo "App Path: $APP_PATH"
          echo ""

          # Step 1: Pull latest code
          echo "=========================================="
          echo "Step 1: Pulling latest code"
          echo "=========================================="
          cd $APP_PATH
          git pull origin master
          if [ $? -eq 0 ]; then
            echo "✓ Git pull successful"
          else
            echo "✗ Git pull failed"
            exit 1
          fi
          echo ""

          # Step 2: Backend setup
          echo "=========================================="
          echo "Step 2: Backend setup"
          echo "=========================================="
          cd $APP_PATH/backend

          echo "Checking PHP..."
          php --version

          echo "Installing composer dependencies..."
          composer install --no-interaction --prefer-dist
          if [ $? -eq 0 ]; then
            echo "✓ Composer install successful"
          else
            echo "✗ Composer install failed"
            exit 1
          fi

          echo "Running migrations..."
          php artisan migrate --force
          if [ $? -eq 0 ]; then
            echo "✓ Migrations successful"
          else
            echo "✗ Migrations failed"
            exit 1
          fi

          echo "Clearing caches..."
          php artisan cache:clear
          php artisan route:clear
          php artisan config:clear
          php artisan view:clear
          echo "✓ Caches cleared"
          echo ""

          # Step 3: Frontend build
          echo "=========================================="
          echo "Step 3: Frontend build"
          echo "=========================================="
          cd $APP_PATH/frontend

          echo "Checking Node..."
          node --version
          npm --version

          echo "Installing npm dependencies..."
          npm install --legacy-peer-deps
          if [ $? -eq 0 ]; then
            echo "✓ NPM install successful"
          else
            echo "✗ NPM install failed"
            exit 1
          fi

          echo "Removing problematic .user.ini file if exists..."
          find dist -name ".user.ini" -exec rm -f {} + 2>/dev/null || true

          echo "Building frontend..."
          npm run build
          if [ $? -eq 0 ]; then
            echo "✓ Frontend build successful"
          else
            echo "✗ Frontend build failed"
            exit 1
          fi

          echo "Checking frontend build output..."
          if [ -d "$APP_PATH/frontend/dist" ]; then
            echo "✓ Frontend build exists"
            ls -la $APP_PATH/frontend/dist/ | head -5
          else
            echo "✗ Frontend build NOT found"
            exit 1
          fi
          echo ""

          # Step 4: Service restart
          echo "=========================================="
          echo "Step 4: Restarting services"
          echo "=========================================="

          echo "Restarting Nginx..."
          systemctl restart nginx
          if [ $? -eq 0 ]; then
            echo "✓ Nginx restarted"
          else
            echo "✗ Nginx restart failed"
            exit 1
          fi

          echo "Restarting OpenLiteSpeed..."
          systemctl restart lsws
          if [ $? -eq 0 ]; then
            echo "✓ OpenLiteSpeed restarted"
          else
            echo "✗ OpenLiteSpeed restart failed"
            exit 1
          fi

          echo "Restarting MySQL..."
          systemctl restart mysql
          if [ $? -eq 0 ]; then
            echo "✓ MySQL restarted"
          else
            echo "✗ MySQL restart failed"
            exit 1
          fi
          echo ""

          # Step 5: Verification
          echo "=========================================="
          echo "Step 5: Verification"
          echo "=========================================="

          echo "Checking services status..."
          systemctl status nginx | grep Active
          systemctl status lsws | grep Active
          systemctl status mysql | grep Active
          echo ""

          echo "Checking frontend build..."
          if [ -f "$APP_PATH/frontend/dist/manifest.json" ]; then
            echo "✓ Frontend manifest found"
          else
            echo "✗ Frontend manifest NOT found"
          fi
          echo ""

          echo "Checking backend Laravel..."
          if [ -f "$APP_PATH/backend/artisan" ]; then
            echo "✓ Laravel installation valid"
          else
            echo "✗ Laravel installation invalid"
          fi
          echo ""

          echo "Checking website accessibility..."
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" https://dashboard.waktunyaphotobooth.com/
          curl -s -o /dev/null -w "Build assets status: %{http_code}\n" https://dashboard.waktunyaphotobooth.com/build/manifest.json
          echo ""

          echo "=========================================="
          echo "DEPLOYMENT COMPLETED SUCCESSFULLY ✓"
          echo "=========================================="
          echo "Time: $(date)"
          echo ""
