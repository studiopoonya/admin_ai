name: Deploy to VPS

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /www/wwwroot/dashboard.waktunyaphotobooth.com
          git pull origin master

          cd backend
          composer install
          php artisan migrate
          php artisan cache:clear
          php artisan route:clear
          php artisan config:clear

          cd ../frontend
          npm install
          npm run build

          cd ..
          systemctl restart nginx lsws mysql
