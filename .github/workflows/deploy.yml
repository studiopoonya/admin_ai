name: Deploy to VPS

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Test SSH Connection
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        timeout: 30s
        command_timeout: 30s
        script: |
          echo "User: $(whoami)"
          ls -la /www/wwwroot/dashboard.waktunyaphotobooth.com/admin_ai
          echo "SSH Test PASSED ✓"

    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        timeout: 600s
        command_timeout: 600s
        script: |
          set -e

          # Git repo (source of truth)
          REPO="/www/wwwroot/dashboard.waktunyaphotobooth.com/admin_ai"

          # Deploy targets (sesuai subdomain aaPanel)
          BACKEND_DEPLOY="/www/wwwroot/api-dashboard.waktunyaphotobooth.com"
          FRONTEND_DEPLOY="/www/wwwroot/dashboard.waktunyaphotobooth.com"

          echo "=========================================="
          echo "DEPLOYMENT START - $(date)"
          echo "=========================================="

          # Step 1: Pull latest code
          echo "--- Step 1: Git pull ---"
          cd $REPO
          git pull origin master
          echo "✓ Git pull successful"

          # Step 2: Deploy Backend → api_dashboard.waktunyaphotobooth.com
          echo "--- Step 2: Backend deploy ---"

          # Backup .env dulu sebelum rm -rf
          if [ -f "$BACKEND_DEPLOY/backend/.env" ]; then
            cp $BACKEND_DEPLOY/backend/.env /tmp/wabot_backend.env
            echo "✓ .env backed up"
          else
            echo "✗ ERROR: .env tidak ditemukan di $BACKEND_DEPLOY/backend/.env"
            echo "  Buat .env manual dulu di server sebelum deploy!"
            exit 1
          fi

          rm -rf $BACKEND_DEPLOY/backend
          cp -r $REPO/backend $BACKEND_DEPLOY/backend
          echo "✓ Backend copied"

          # Restore .env
          cp /tmp/wabot_backend.env $BACKEND_DEPLOY/backend/.env
          echo "✓ .env restored"

          cd $BACKEND_DEPLOY/backend

          composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader
          echo "✓ Composer install OK"

          php artisan migrate --force
          echo "✓ Migrations OK"

          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          echo "✓ Cache built"

          chmod -R 775 storage bootstrap/cache
          chown -R www:www $BACKEND_DEPLOY/backend
          echo "✓ Permissions set"

          # Step 3: Build Frontend → dashboard.waktunyaphotobooth.com
          echo "--- Step 3: Frontend build ---"
          cd $REPO/frontend

          node --version
          npm --version

          npm install --legacy-peer-deps
          echo "✓ NPM install OK"

          # Hapus .user.ini immutable di dist (aaPanel auto-creates ini)
          if [ -f "$REPO/frontend/dist/.user.ini" ]; then
            chattr -i $REPO/frontend/dist/.user.ini
            rm -f $REPO/frontend/dist/.user.ini
          fi
          rm -rf $REPO/frontend/dist

          # Build langsung ke folder static dashboard
          npm run build
          echo "✓ Frontend build OK"

          # Copy dist ke root dashboard (site Static aaPanel)
          rm -rf $FRONTEND_DEPLOY/*.html $FRONTEND_DEPLOY/assets
          cp -r $REPO/frontend/dist/* $FRONTEND_DEPLOY/
          echo "✓ Frontend deployed ke $FRONTEND_DEPLOY"

          # Step 4: Reload Nginx
          echo "--- Step 4: Reload Nginx ---"
          nginx -t && systemctl reload nginx
          echo "✓ Nginx reloaded"

          # Step 5: Restart queue worker
          echo "--- Step 5: Queue worker ---"
          supervisorctl restart wabot-queue || echo "⚠ wabot-queue belum ada di Supervisor (skip)"

          # Step 6: Verify
          echo "--- Step 6: Verification ---"
          [ -f "$FRONTEND_DEPLOY/index.html" ] && echo "✓ Frontend index.html OK" || { echo "✗ Frontend index.html tidak ada"; exit 1; }
          [ -f "$BACKEND_DEPLOY/backend/artisan" ] && echo "✓ Laravel backend OK" || { echo "✗ Laravel artisan tidak ada"; exit 1; }

          echo "=========================================="
          echo "DEPLOYMENT COMPLETED ✓ - $(date)"
          echo "=========================================="
